<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine’s Adventure 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#f5eefe;
  font-family:'Press Start 2P', monospace;
}

.console{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.screen{
  width:360px;
  height:520px;
  background:#eaffea;
  border:8px solid #a7dca7;
  border-radius:14px;
  padding:10px;
  position:relative;
  overflow:hidden;

  display:flex;
  justify-content:center;
  align-items:center;
}

.controls{
  margin-top:14px;
  display:flex;
  gap:30px;
}

.control-btn{
  width:60px;
  height:18px;
  background:#b7b7b7;
  border-radius:20px;
  font-size:8px;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  box-shadow: inset 0 -2px 0 #888;
}

h1,p{
  font-size:11px;
  text-align:center;
  color:#2f5f2f;
}

button{
  font-family:'Press Start 2P', monospace;
  font-size:10px;
  padding:6px 10px;
  border:none;
  border-radius:6px;
  background:#c8facc;
  cursor:pointer;
}

.btn-emoji{
  width:60px;
  height:60px;
  font-size:22px;
  margin:6px;
  background:#d6ffd6;
  border:3px solid #9fd89f;
}

.hidden{display:none;}

#score{
  position:absolute;
  top:6px;
  left:6px;
  font-size:9px;
}

/* Floating hearts */
.heart{
  position:absolute;
  font-size:14px;
  animation:floatUp 3s steps(6) infinite;
  pointer-events:none;
}
@keyframes floatUp{
  from{transform:translateY(40px); opacity:0;}
  50%{opacity:1;}
  to{transform:translateY(-120px); opacity:0;}
}

/* Cat */
.cat{
  position:absolute;
  bottom:10px;
  font-size:18px;
  animation:catWalk 8s steps(8) infinite;
}
@keyframes catWalk{
  from{left:-30px;}
  to{left:380px;}

}

  

/* ✨ LOOPING FIREWORKS ON YES */
document.getElementById("yes").onclick = ()=>{
  document.getElementById("final").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");
  document.getElementById("message").textContent =
    "Yay! You just made my day! 💖";

  if(!fireworksLoop){
    fireworksLoop = setInterval(fireworks, 400);
  }
};

document.getElementById("no").onclick = ()=>{
  document.getElementById("final").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");
  document.getElementById("message").textContent =
    "It’s okay! You’re still awesome! 😊";
};

function fireworks(){
  for(let i=0;i<6;i++){
    const f = document.createElement("div");
    f.className = "firework";
    f.textContent = "✨";
    f.style.left = Math.random()*300 + "px";
    f.style.top = Math.random()*200 + "px";
    screen.appendChild(f);
    setTimeout(()=>f.remove(),800);
  }
}

/* No button run away */
#no{
  position:relative;
  transition:transform 0.3s ease;
}

    .correct-grow{
  transform: scale(1.4);
  transition: transform 0.3s ease;
  box-shadow: 0 0 12px #8aff8a;
}

.wrong-shake{
  animation: shake 0.3s;
}

@keyframes shake{
  0%{ transform: translateX(0); }
  25%{ transform: translateX(-5px); }
  50%{ transform: translateX(5px); }
  75%{ transform: translateX(-5px); }
  100%{ transform: translateX(0); }
}
</style>
</head>

<body>

<div class="console">
  <div class="screen">
    <div id="score">Score: 0</div>

    <audio id="bgm" src="valentine.mp3" loop></audio>

    <div id="instructions">
      <h1>Valentine’s Adventure 🎮</h1>
      <p>Answer fun questions.</p>
      <p>Reach 100 points to unlock a surprise!</p>
      <p>(Press START)</p>
    </div>

    <div id="game" class="hidden">
      <h1 id="question"></h1>
      <div id="choices"></div>
      <p id="points">Points: 0</p>
    </div>

    <div id="final" class="hidden">
      <h1>Will you be my Valentine? ❤️</h1>
      <button id="yes">Yes 💕</button>
      <button id="no">No 😊</button>
    </div>

    <div id="result" class="hidden">
      <h1 id="message"></h1>
    </div>
  </div>

  <!-- 🕹️ Game Boy Buttons -->
  <div class="controls">
    <div class="control-btn" id="startBtn">START</div>
    <div class="control-btn" id="selectBtn">SELECT</div>
  </div>
</div>

<script>
const questions = [
  {q:"Who loves you the most?", o:["John","Sam","Yuri","Regine Velasquez"], a:"Yuri"},
  {q:"Which drink do you prefer?", o:["🍵","🥤"], a:"🍵"},
  {q:"Favorite flower?", o:["🌻","🌹"], a:"🌻"},
  {q:"Favorite food?", o:["🍗","🍕"], a:"🍗"},
  {q:"Pick one!", o:["👟","💐"], a:"💐"}
];

let score=0, index=0;

const bgm = document.getElementById("bgm");
const screen = document.querySelector(".screen");

document.getElementById("startBtn").onclick = startGame;
document.getElementById("selectBtn").onclick = ()=>location.reload();

function startGame(){
  document.getElementById("instructions").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  bgm.volume=0.4;
  bgm.play();
  loadQuestion();
  spawnHearts();
  spawnCat();
}

function loadQuestion(){
  if(score>=100){
    document.getElementById("game").classList.add("hidden");
    document.getElementById("final").classList.remove("hidden");
    return;
  }
  const q=questions[index%questions.length];
  document.getElementById("question").textContent=q.q;
  const c=document.getElementById("choices");
  c.innerHTML="";
  q.o.forEach(opt=>{
    const b=document.createElement("button");
    b.className="btn-emoji";
    b.textContent=opt;
   b.onclick=()=>{

  const buttons = document.querySelectorAll(".btn-emoji");

  if(opt === q.a){
    score += 20;
    b.classList.add("correct-grow");
  } else {
    b.classList.add("wrong-shake");

    // Make the correct answer grow
    buttons.forEach(btn=>{
      if(btn.textContent === q.a){
        btn.classList.add("correct-grow");
      }
    });
  }

  updateScore();

  setTimeout(()=>{
    index++;
    loadQuestion();
  }, 800); // delay so animation shows
};
    c.appendChild(b);
  });
}

function updateScore(){
  document.getElementById("points").textContent="Points: "+score;
  document.getElementById("score").textContent="Score: "+score;
}

function spawnHearts(){
  setInterval(()=>{
    const h=document.createElement("div");
    h.className="heart";
    h.textContent="💗";
    h.style.left=Math.random()*320+"px";
    h.style.bottom="0";
    screen.appendChild(h);
    setTimeout(()=>h.remove(),3000);
  },900);
}

function spawnCat(){
  const cat=document.createElement("div");
  cat.className="cat";
  cat.textContent="😼";
  screen.appendChild(cat);
}

document.getElementById("no").onmouseover = ()=>{
  const x=(Math.random()*80)-40;
  const y=(Math.random()*40)-20;
  document.getElementById("no").style.transform=`translate(${x}px,${y}px)`;
};

document.getElementById("yes").onclick=()=>{
  document.getElementById("final").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");
  document.getElementById("message").textContent="Yay! You just made my day! 💖";
  fireworks();
};

function fireworks(){
  for(let i=0;i<12;i++){
    const f=document.createElement("div");
    f.className="firework";
    f.textContent="✨";
    f.style.left=Math.random()*300+"px";
    f.style.top=Math.random()*200+"px";
    screen.appendChild(f);
    setTimeout(()=>f.remove(),800);
  }
}
</script>

</body>
</html>
